# Статический сайт на Astro: сборка, на FTP уходит только dist/.
# Секреты не менялись:
#   FTP_SERVER, FTP_USERNAME, FTP_PASSWORD, REG_PATH
# FTP-пользователь привязан к каталогу сайта www/moscow.adnomads.ru.
# REG_PATH для него: ./
# Пуш в main публикует сайт. dangerous-clean-slate не включён.
name: Deploy moscow.adnomads.ru to REG.RU

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: moscow-adnomads-ftp-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build website
        run: npm run build

      - name: Upload website to REG.RU
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: ./dist/
          server-dir: ${{ secrets.REG_PATH }}
          state-name: .ftp-deploy-sync-state.json
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/.cursor/**
            **/node_modules/**
            **/.ftp-deploy-sync-state.json
            **/desktop.ini
            **/*.md
